project:
  type: website
  output-dir: docs
  render:
        - "*.qmd"
        - "Syllabus/Syllabus.Rmd"
        - "writeups/Dashboards/img/Dashboard.qmd"
  title: "BUS 1301: Managing with AI - Spring 2026"

website:
  description: "Managing with Data: Analytics and Artificial Intelligence"
  site-url: https://robertwwalker.github.io/BUS1301-SP26 # you must change this appropriately for RSS feeds to work properly
  title: "Managing with Data, Analytics, AI"
  page-navigation: true
  navbar:
    title: "BUS 1301"
    search: true
    logo: "AGSMlogo.jpeg"
    background: "#af98e6"
    right:
      - about.qmd
      - icon: github
        href: https://github.com/robertwwalker/
      - icon: twitter
        href: https://twitter.com/PieRatio


  sidebar:
     style: "docked"
     contents:
       - text: "Syllabus"
         href: syllabus/index.qmd
       - text: "Slides"
         href: slides/index.qmd
       - text: "Write-ups"
         href: writeups/index.qmd

format:
  html:
    theme:
      - morph
      - brand
    lightbox: true
    code-fold: true
    code-summary: "How's that done?"
    css: styles.css

execute:
  freeze: true

